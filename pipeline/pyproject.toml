[project]
name = "marswalk-pipeline"
version = "0.1.0"
description = "Hyperlocal NASA Mars data processing pipeline for Marswalk Navigator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
